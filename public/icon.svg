  <!-- Right eye lens -->
  <circle cx="360" cy="272" r="76" fill="url(#lensGlow)" stroke="url(#opticsGrad)" stroke-width="20"/>
  <!-- Temple hinges -->
  <path d="M76 264H50C42 264 36 258 36 250V220" stroke="url(#opticsGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M436 264H462C470 264 476 258 476 250V220" stroke="url(#opticsGrad)" stroke-width="18" stroke-linecap="round"/>
  <!-- Lens reflection highlight -->
  <path d="M124 232C136 220 152 216 168 220" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M332 232C344 220 360 216 376 220" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.6"/>
</svg>
